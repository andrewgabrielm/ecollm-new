name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-unit-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      UV_PYTHON_DOWNLOADS: never
      MOCK_MODE: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.6"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.8"
          enable-cache: false
      - name: Create the sole root environment
        run: uv venv --python 3.11 .venv --no-python-downloads
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.1"
      - name: Install only locked dependencies
        run: make install
      - name: Install project-local test browser
        run: frontend/node_modules/.bin/playwright install chromium
      - name: Offline static, unit and secret checks
        run: make help lint test test-privacy test-ui smoke
